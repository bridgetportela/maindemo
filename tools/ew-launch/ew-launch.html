     ${sn.length?`<textarea id="reply" data-mention="1" rows="2" placeholder="Reply, @mention…" style="margin-top:8px"></textarea>${sn.length>1?`<select id="rsnap" style="margin-top:6px">${sn.map(s=>`<option value="${s.id}">${esc(s.title)}</option>`).join('')}</select>`:`<input type="hidden" id="rsnap" value="${sn[0].id}">`}<div style="text-align:right;margin-top:6px"><button class="btn sm pri" data-act="replyEd">Reply</button></div>`:''}`;
  }
  if(S.tab==='Outline') return ['Section 1','Section 2','Section 3'].map(s=>`<div class="blk">${s}</div>`).join('');
  if(S.tab==='Content') return rows().filter(r=>r.type==='page').map(r=>`<div style="padding:5px 4px;${r.path===p?'color:var(--blue);font-weight:700':''}">📄 ${esc(r.path.slice(1))}</div>`).join('');
  const hist=`<div class="it"><b>Current</b></div>${[['Nov 11, 2026, 10:12 AM','1 change'],['Nov 3, 2026, 3:30 PM',''],['Nov 1, 2026, 10:00 AM','']].map(([d,c])=>`<div class="it"><b>Previewed</b><div class="small mute">${d} · Alex</div>${c?`<div class="small mute">${c}</div>`:''}</div>`).join('')}`;
  if(!idea()) return `<div class="small mute" style="margin-bottom:10px">Press ⌘ ⌥ S to add to version history while editing.</div><div class="tl">${hist}</div>`;
  const sn=snapsOf(p); const changed=sn.filter(s=>pageChanged(s,p));
  const banners=changed.map(s=>`<div class="note n-amber">✏️ Edited after it was added to <b>${esc(s.title)}</b>.<div style="margin-top:6px"><button class="btn sm" data-act="viewChanges" data-id="${s.id}">View changes</button> ${s.state==='Draft'&&isAuthor()?`<button class="btn pri sm" data-act="updateSnap" data-id="${s.id}">Overwrite</button>`:'<span class="small mute">The snapshot is locked while in review, so its copy stays as it was.</span>'}</div></div>`).join('');
  const live=db.live[p]?`<div class="it"><b>Live</b><div class="small mute">Published ${fmt(db.live[p]).split(',')[0]}${db.ver[p]?' · v'+db.ver[p]:''}</div>${(()=>{const e=db.early.filter(x=>x.path===p).slice(-1)[0]; return e&&e.when===db.live[p]?`<div style="margin-top:2px">${chip('Published early','amber')}</div><div class="small mute">${esc(e.by)}: ${esc(e.reason)}</div>`:'';})()}${db.liveVia[p]&&snap(db.liveVia[p])?`<button class="link small" data-act="openSnap" data-id="${db.liveVia[p]}">View publish record</button>`:''}</div>`:'';
  const snaps=sn.map(s=>`<div class="it"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div><b>${esc(s.title)}</b><div class="small mute">${s.single?'Publish request':'Snapshot'} · ${s.state}${s.steps&&s.state==='In review'?' · '+s.steps[s.step].title:''}${s.scheduledFor?'':' · added '+fmtD(s.createdAt)}</div></div>${chip(s.single?'Request':'Snapshot','gray')}</div>${s.blockDirect?'<div>'+chip('🔒 Direct publish blocked','amber')+'</div>':''}${pageChanged(s,p)||snapEdited(s,p)?'<div style="margin-top:2px">'+(pageChanged(s,p)?chip('Update available','amber'):'')+(snapEdited(s,p)?chip('Overridden','purple'):'')+'</div>':''}<button class="link small" data-act="viewChanges" data-id="${s.id}">Compare</button></div>${s.scheduledFor?`<div class="it"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div><b>Scheduled</b><div class="small mute">Publishes ${fmt(s.scheduledFor)}</div></div>${chip('Scheduled','purple')}</div></div>`:''}`).join('');
  const psd=pageSchedFor(p); const psEntry=psd?`<div class="it"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start"><div><b>Scheduled</b><div class="small mute">Publishes ${fmt(psd)}</div></div>${chip('Scheduled','purple')}</div></div>`:'';
  const draft=`<div class="it"><b>Current draft</b><div class="small mute">${changed.length?'Edited today by Alex':'No changes since last version'}</div></div>`;
  return `${banners}<div class="tl">${live}${snaps}${psEntry}${draft}</div><div class="small mute" style="margin:10px 0 6px;font-weight:700">History</div><div class="tl">${hist}</div>`;
}

function rowMenu(s,p){

/* review */
function reviewView(){
  const s=snap(S.snapId); const pend=s.pages.filter(p=>p.review==='Not reviewed');
  if(!pend.find(p=>p.path===S.revPath)) S.revPath=pend[0]&&pend[0].path;
  const p=S.revPath&&s.pages.find(x=>x.path===S.revPath);
  const head=`<div class="app"><p><button class="link" data-act="go" data-s="browse">‹ Back</button></p><h1 style="font-size:26px">Review: ${esc(s.title)} ${stateChip(s.state)}${s.state==='In review'?chip('Snapshot locked','gray'):''}</h1>${stepsHtml(s)}`;
  if(!p){ const nc=counts(s).needs; return head+(nc?`<div class="note n-amber">${nc} page${nc>1?'s':''} sent back to the author. Approved pages are not re-reviewed.</div>`:`<div class="note n-green">✅ All pages are approved.${s.scheduledFor?' It publishes '+fmt(s.scheduledFor)+'.':''}</div>`)+'</div>'; }

/* actions */
function addPaths(s){ let n=0; s.copies=s.copies||{}; s.base=s.base||{}; const fo=[...S.sel].filter(isFolder); S.skipped=0; S.shared=0; S.held=[];
  S.sel.forEach(p=>{ if(isFolder(p)) return; if(S.onlyEdited&&fo.some(x=>kids(x).includes(p))&&!isEdited(p)){ S.skipped++; return; }
    const cl=claimedBy(p,s); if(cl){ S.held.push(cl.title); return; }
    if(!entryFor(s,p)){ if(othersWith(s,p).length) S.shared++; s.pages.push({path:p,review:'Not reviewed'}); s.copies[p]=clone(content(p)); s.base[p]=clone(content(p)); n++; } }); S.onlyEdited=false; return n; }
function copyApply(dir,sid,paths,mode,quiet){ const s=snap(sid); s.base=s.base||{}; let others=new Set();
  paths.forEach(path=>{ const e=s.pages.find(x=>x.path===path);
    [path].concat(kids(path)).forEach(x=>{
      if(dir==='fork'){ s.copies[x]=clone(content(x)); s.base[x]=clone(content(x)); }
      else { db.content[x]=clone(s.copies[x]); s.base[x]=clone(db.content[x]); othersWith(s,x).forEach(t=>others.add(t.title)); }
    });
    if(e&&dir==='fork') e.synced=true; });
  if(quiet) return;
  const verb=mode==='merge'?'Merged':(dir==='fork'?'Overwritten':'Promoted');
  toast(dir==='fork'?`${verb}: snapshot version updated from the current page`:`${verb} to main`+(others.size?` · ${[...others].join(', ')} ${others.size>1?'now show':'now shows'} Update available`:'')); }
function publish(s,by){ s.pages.forEach(e=>{ if(e.isNew){ db.pages.push({path:e.path,type:'page',title:db.newPages[e.path].title}); delete e.isNew; } }); s.state='Published'; s.locked=true; s.publishedAt=(by==='Scheduled publish'&&s.scheduledFor)?s.scheduledFor:tick(); const recPages=[];
  s.pages.forEach(e=>[e.path].concat(kids(e.path)).forEach(x=>{ db.live[x]=s.publishedAt; db.liveContent[x]=clone(copyFor(s,x)); db.ver[x]=(db.ver[x]||0)+1; db.liveVia[x]=s.id; recPages.push({path:x,title:title(x),version:db.ver[x]}); }));
  s.record={publishedAt:s.publishedAt,by:by||uname(meId()),requestedBy:s.requestedBy||'Alex',requestedAt:s.requestedAt||(s.createdAt?s.createdAt+'T09:00:00-08:00':s.publishedAt),workflow:s.workflow||null,steps:(s.steps||[]).map((st,i)=>({title:st.title,approvals:(s.approvals&&s.approvals[i])||[]})),pages:recPages,early:db.early.filter(x=>x.blockedBy.includes(s.id)).map(x=>({path:x.path,by:x.by,when:x.when,reason:x.reason}))};
  toast(s.title+' is live · all pages show Published'); }
const A={
  mode(el){ S.mode=el.dataset.m; S.inbox=false; if(S.mode==='today'&&S.tab==='Review') S.tab='Versions'; },
  go(el){ S.screen=el.dataset.s; },
  reset(){ init(); toast('Reset'); },
  later(){ toast('Not part of this demo yet'); },
  filter(el){ S.filter=el.dataset.f; },
  pick(el){ const p=el.dataset.p,on=!S.sel.has(p); [p].concat(kids(p)).forEach(x=>on?S.sel.add(x):S.sel.delete(x)); },

  addMenu(){ S.menu='add'; },

  edAdd(){ S.menu='edadd'; },
  edAddTo(el){ S.sel=new Set([S.path]); A.addTo(el); },
  edNew(){ S.sel=new Set([S.path]); S.modal={type:'new',addSel:true}; },
  newIn(){ S.modal={type:'new',addSel:true}; },
  newSnap(){ S.modal={type:'new'}; },
  createSnap(){ const t=document.getElementById('nm').value.trim(); if(!t){ toast('Add a title first'); return; }
    const s={id:slug(t)||'snapshot',title:t,description:document.getElementById('ds').value.trim(),state:'Draft',locked:false,createdAt:NOW().toISOString().slice(0,10),scheduledFor:null,pages:[],copies:{},base:{}};
    S.held=[]; S.shared=0; if(S.modal.addSel){ addPaths(s); S.sel.clear(); } db.snapshots.unshift(s); S.modal=null; toast(`Created ${t}`+(S.held.length?` · ${S.held.length} page${S.held.length>1?'s':''} held by ${[...new Set(S.held)].join(', ')} not added`:'')+(S.shared?` · ${S.shared} also in another snapshot`:''),['openSnap',s.id],'Open'); },
  openPage(el){ S.editSnap=null; S.path=el.dataset.p; S.screen='editor'; S.tab='Versions'; },
  send(){ S.sendOpen=!S.sendOpen; },
  badge(){ S.menu='badge'; },
  tab(el){ S.tab=el.dataset.t; },
  panels(){ S.panels=true; },
  openApp(){ S.screen='snapshots'; },
  openSnap(el){ S.snapId=el.dataset.id; S.screen=idea()?'snapshot':'snapshots'; if(!idea()) S.open=el.dataset.id; },
  toggle(el){ S.open=S.open===el.dataset.id?null:el.dataset.id; S.openUrl=null; S.snapId=el.dataset.id; },
  launchToggle(){ S.launchOpen=!S.launchOpen; },
  tEdit(el){ S.editSnap=null; S.path=el.dataset.p; S.screen='editor'; S.tab='Versions'; },
  tEditSnap(el){ S.snapId=el.dataset.sid; A.editSnapVer({dataset:{p:el.dataset.p}}); },
  tSync(el){ const sn=snap(el.dataset.sid), e=sn.pages.find(x=>x.path===el.dataset.p); S.snapId=sn.id; if(!e.synced) copyApply('fork',sn.id,[e.path],'overwrite'); else S.modal={type:'copyMode',dir:'fork',snap:sn.id,paths:[e.path]}; },
  tPromote(el){ S.snapId=el.dataset.sid; S.modal={type:'copyMode',dir:'promote',snap:el.dataset.sid,paths:[el.dataset.p]}; },
  tLaunchSync(el){ const sn=snap(el.dataset.sid); S.snapId=sn.id; S.modal={type:'copyMode',dir:'fork',snap:sn.id,paths:sn.pages.map(e=>e.path)}; },
  tLaunchPromote(el){ const sn=snap(el.dataset.sid), ps=sn.pages.filter(e=>e.synced).map(e=>e.path); S.snapId=sn.id; if(!ps.length){ toast('Nothing to promote yet. Sync a page first.'); return; } S.modal={type:'copyMode',dir:'promote',snap:sn.id,paths:ps}; },
  url(el){ S.openUrl=S.openUrl===el.dataset.u?null:el.dataset.u; },
  rowMenu(el){ S.menu={p:el.dataset.p}; },
  addPages(){ psecCur='all'; S.modal={type:'picker'}; },
  pickAdd(){ const vals=[...document.querySelectorAll('#pklist input:checked')].map(i=>i.value); if(!vals.length){ toast('Pick at least one page'); return; } S.sel=new Set(vals); const s=snap(S.snapId); const n=addPaths(s); S.sel.clear(); S.modal=null; toast((n?`Added ${n} page${n===1?'':'s'} to ${s.title}${S.shared?` · ${S.shared} also in another snapshot`:''}`:'Nothing added')+(S.held.length?` · ${S.held.length} held by ${[...new Set(S.held)].join(', ')}`:'')); },
  newPageOpen(){ S.modal={type:'newPage'}; },
  createPage(){ const name=document.getElementById('npn').value.trim(), path=document.getElementById('npp').value.trim(), tpl=document.getElementById('npt').value;
    if(!name){ toast('Add a page name first'); return; }
    if(!/^\/[a-z0-9\-\/]+$/.test(path)){ toast('Path should look like /product-launch'); return; }
    const t=pathTakenBy(path); if(t){ toast('That path is already used'+(t!==true?' by '+t.title:'')); return; }
    const s=snap(S.snapId); db.newPages[path]={title:name,snap:s.id,template:tpl};
    const blocks=({'Blank':[],'Landing page':['Hero','Cards','Footer CTA'],'Article':['Hero','Article body']})[tpl].map((t2,i)=>({id:'n'+i,t:t2}));
    db.content[path]={headline:name,body:'New page. Start writing here.',img:IMGS[0],blocks};
    s.pages.push({path,review:'Not reviewed',isNew:true}); s.copies=s.copies||{}; s.base=s.base||{}; s.copies[path]=clone(db.content[path]); s.base[path]=clone(db.content[path]); S.modal=null;
    toast('Created '+name+' in '+s.title,['openNewPage',path],'Open in editor'); },
  openNewPage(el){ S.editSnap=null; S.path=el.dataset.id; S.screen='editor'; S.tab='Versions'; },
  delSnap(){ S.modal={type:'confirm'}; },
  delGo(){ const d=snap(S.snapId); (d.pages||[]).filter(e=>e.isNew).forEach(e=>{ delete db.content[e.path]; delete db.newPages[e.path]; }); db.snapshots=db.snapshots.filter(s=>s.id!==S.snapId); S.modal=null; S.screen='snapshots'; toast('Snapshot deleted'); },
  remove(el){ const s=snap(S.snapId),e=s.pages.find(x=>x.path===el.dataset.p); if(e&&e.isNew){ delete db.content[e.path]; delete db.newPages[e.path]; } s.pages=s.pages.filter(x=>x.path!==el.dataset.p); toast(e&&e.isNew?'New page discarded':'Removed from snapshot'); },
  cmp(el){ const p=el.dataset.p,s=snap(S.snapId),k=el.dataset.k,cp=copyFor(s,p);
    if(k==='live') S.modal={type:'cmp',title:'Compare with live · '+title(p),ll:'Live',l:db.liveContent[p]||null,rl:'Snapshot version',r:cp};
    else if(k==='cur') S.modal={type:'cmp',title:'Compare with current · '+title(p),ll:'Snapshot version',l:cp,rl:'Current page',r:content(p),upd:isAuthor()&&(pageChanged(s,p)||snapEdited(s,p))&&(s.state==='Draft'||entryFor(s,p).review==='Needs changes')?{id:s.id,p}:null};
    else S.modal={type:'cmp',single:true,title:'Preview · '+title(p),note:'How this page will look when '+esc(s.title)+' publishes. It isn\'t live yet.',ll:'Snapshot version',l:cp}; },
  cmpSnaps(el){ const p=el.dataset.p,s=snap(S.snapId),o=snap(el.dataset.o); S.modal={type:'cmp',title:'Compare · '+title(p),note:'Two snapshots hold their own copy of this page. Check which version should go live.',ll:s.title,l:copyFor(s,p),rl:o.title,r:copyFor(o,p)}; },
  viewChanges(el){ const s=snap(el.dataset.id),p=S.path;
    S.modal={type:'cmp',title:'View changes · '+title(p),note:pageChanged(s,p)?'The page was edited after it was added to '+esc(s.title)+'. Keep it as is, or overwrite the snapshot with the current page.':'',ll:'Snapshot version',l:copyFor(s,p),rl:'Current page',r:content(p),upd:isAuthor()&&s.state==='Draft'&&pageChanged(s,p)?{id:s.id,p}:null}; },
  updateSnap(el){ A.doUpdate({dataset:{id:el.dataset.id,p:S.path}}); },
  doUpdate(el){ const s=snap(el.dataset.id); s.base=s.base||{}; [el.dataset.p].concat(kids(el.dataset.p)).forEach(x=>{ s.copies[x]=clone(content(x)); s.base[x]=clone(content(x)); }); const en=s.pages.find(x=>x.path===el.dataset.p); if(en&&s.launch) en.synced=true; S.modal=null; toast('Snapshot overwritten from the current page'); },
  swapImg(){ const c=cur(); c.img=IMGS[(IMGS.indexOf(c.img)+1)%IMGS.length]; },
  mv(el){ const c=cur(),i=+el.dataset.i,j=i+ +el.dataset.d; if(j<0||j>=c.blocks.length) return; [c.blocks[i],c.blocks[j]]=[c.blocks[j],c.blocks[i]]; },
  rmBlock(el){ cur().blocks.splice(+el.dataset.i,1); },
  addBlock(){ cur().blocks.push({id:'n'+Date.now(),t:'New promo block'}); },
  toggleBlock(){ const s=snap(S.snapId); if(s.state!=='Draft'||!isAuthor()) return; s.blockDirect=!s.blockDirect; if(s.blockDirect&&!s.earlyAllowed) s.earlyAllowed=['sarah']; toast(s.blockDirect?'Direct publish blocked for pages in '+s.title:'Direct publish allowed again for pages in '+s.title); },
  toggleHold(){ const s=snap(S.snapId); if(s.state!=='Draft'||!isAuthor()) return; s.exclusive=!s.exclusive; toast(s.exclusive?'Other snapshots can no longer add pages from '+s.title:'Pages in '+s.title+' can be added to other snapshots again'); },
  schedule(){ S.modal={type:'schedule'}; },
  saveSchedule(){ const v=document.getElementById('when').value; if(!v){ toast('Pick a date and time'); return; } snap(S.snapId).scheduledFor=new Date(v+':00-08:00').toISOString(); S.modal=null; toast('Scheduled'); },
  unschedule(){ snap(S.snapId).scheduledFor=null; S.modal=null; toast('Schedule cleared'); },
  reqReview(){ S.modal={type:'request'}; },
  sendRequest(){ const m=S.modal; const wf=document.getElementById('wfsel').value, w=WORKFLOWS[wf], nt=document.getElementById('nt').value.trim();
    if(nt.length<5){ toast('Add a note for reviewers (at least 5 characters)'); return; }
    let sched=null; if(m.scope==='page'&&document.getElementById('pubmode')&&document.getElementById('pubmode').value==='later'){ const v=document.getElementById('pubwhen').value, d=new Date(v+':00-08:00'); if(!v||d<=NOW()){ toast('Pick a time in the future'); return; } sched=d.toISOString(); }
    let s;
    if(m.scope==='page'){ s=makePageRequest(m.path,wf); if(sched) s.scheduledFor=sched; } else { s=snap(S.snapId); }
    s.state='In review'; s.locked=true; s.requestedBy=uname(meId()); s.requestedAt=tick(); s.approvals={}; s.workflow=wf; s.steps=clone(w.steps); s.step=0; s.approvers=w.steps[0].approvers.slice(); s.watchers=w.watchers.slice(); s.pages.forEach(p=>p.review='Not reviewed');
    addComment(s.id,null,'request-note',nt);
    S.modal=null; toast('Review requested · '+stepNames(w.steps[0].approvers)+' to review'+(w.steps.length>1?' (step 1 of '+w.steps.length+')':'')+(w.watchers.length?` · ${stepNames(w.watchers)} notified`:'')+notifyM(nt)); },
  todaySubmit(){ const t=document.getElementById('tdesc').value.trim(); if(t.length<5){ toast('Minimum 5 characters required'); return; }
    const w=WORKFLOWS['Request publish']; const s=makePageRequest(S.modal.path,'Request publish'); s.state='In review'; s.locked=true; s.workflow='Request publish'; s.steps=clone(w.steps); s.step=0; s.approvers=w.steps[0].approvers.slice(); s.watchers=w.watchers.slice(); addComment(s.id,null,'request-note',t);
    S.modal=null; toast('Publish requested'); },
  reqPage(){ S.modal={type:'request',scope:'page',path:S.path}; },
  reqPanel(){ S.panels=false; S.modal=idea()?{type:'request',scope:'page',path:S.path}:{type:'todayRequest',path:S.path}; },
  reviewChanges(){ const p=S.modal.path; S.modal={type:'cmp',title:'Review changes · '+title(p),ll:'Live',l:db.liveContent[p]||null,rl:'Current page',r:content(p)}; },
  resend(){ toast('Notification sent again to the reviewers on the current step'); },
  withdrawReq(el){ const w=snap(el.dataset.id); if(w) archiveReq(w); db.snapshots=db.snapshots.filter(x=>x.id!==el.dataset.id); toast('Request withdrawn'); },
  share(){ S.modal={type:'share'}; },
  sendBack(){ const s=snap(S.snapId); s.pages.forEach(p=>{ if(p.review==='Needs changes') p.review='Not reviewed'; }); toast('Sent back. Only pages not yet approved return to the reviewer.'); },
  publishNow(){ publish(snap(S.snapId),uname(meId())); },
  reply(){ const t=document.getElementById('reply').value.trim(); if(!t) return; addComment(S.snapId,null,'reply',t); toast('Comment posted'+notifyM(t)); },
  replyEd(){ const t=document.getElementById('reply').value.trim(); if(!t) return; addComment(document.getElementById('rsnap').value,S.path,'reply',t); toast('Comment posted'+notifyM(t)); },
  openReview(el){ S.snapId=el.dataset.id; S.screen='review'; S.reasonOpen=false; S.revPath=null; },
  revPick(el){ S.revPath=el.dataset.p; S.reasonOpen=false; },
  approve(){ const s=snap(S.snapId),p=s.pages.find(x=>x.path===S.revPath); p.review='Approved'; S.reasonOpen=false; autoDone(s.id,p.path); s.approvals=s.approvals||{}; (s.approvals[s.step]=s.approvals[s.step]||[]).push({page:p.path,who:uname(meId()),behalf:viaGroup(meId(),s),when:tick()});
    if(!s.pages.every(x=>x.review==='Approved')){ toast('Approved'); return; }
    const last=!s.steps||s.step>=s.steps.length-1;
    if(!last){ const done=s.steps[s.step].title; s.step++; s.pages.forEach(x=>x.review='Not reviewed'); toast(`${done} complete. Next: ${s.steps[s.step].title} (${stepNames(s.steps[s.step].approvers)})`); }
    else if(s.single&&!s.scheduledFor){ publish(s,'Automatic, on final approval'); }
    else toast('All pages approved'+(s.scheduledFor?' · publishes '+fmt(s.scheduledFor):'')); },
  reasonOpen(){ S.reasonOpen=true; },
  reasonCancel(){ S.reasonOpen=false; },
  reasonSend(){ const t=document.getElementById('reason').value.trim(); if(!t){ toast('A reason is required'); return; }
    const s=snap(S.snapId),p=s.pages.find(x=>x.path===S.revPath); p.review='Needs changes'; autoDone(s.id,p.path); addComment(s.id,p.path,'reject-reason',t); S.reasonOpen=false; toast('Changes requested · the author is notified'+notifyM(t)); },
  ff(){ const s=db.snapshots.find(x=>x.state==='In review'&&x.pages.every(p=>p.review==='Approved')&&x.scheduledFor); if(s) publish(s,'Scheduled publish'); else { const ps=Object.entries(db.pageSchedule).sort((a,b)=>new Date(a[1])-new Date(b[1]))[0]; if(ps){ db.live[ps[0]]=ps[1]; db.liveContent[ps[0]]=clone(content(ps[0])); delete db.pageSchedule[ps[0]]; toast(title(ps[0])+' is live (scheduled publish)'); } else toast('Nothing approved and scheduled to publish yet'); } },
  unlock(){ snap(S.snapId).locked=false; toast('Unlocked'); },
  cancelReview(){ const s=snap(S.snapId); if(s.single){ archiveReq(s); db.snapshots=db.snapshots.filter(x=>x.id!==s.id); S.screen='snapshots'; toast('Request withdrawn'); return; } s.step=0; s.approvals={}; s.state='Draft'; s.locked=false; s.pages.forEach(p=>p.review='Not reviewed'); addComment(s.id,null,'reply','Review canceled so the snapshot can be edited.'); toast('Review canceled. '+s.title+' is a draft again and can be edited.'); },
  openLink(el){ const s=snap(S.snapId); toast('Opens '+s.id+'--main--'+DATA.site+'--'+DATA.org+'.aem.reviews'+el.dataset.p+' (mock)'); },
  openLive(el){ toast('Opens the live page '+el.dataset.p+' (mock)'); },
  openMain(el){ S.editSnap=null; S.path=el.dataset.p; S.screen='editor'; S.tab='Versions'; },
  backMain(){ S.editSnap=null; },
  editSnapVer(el){ const s=snap(S.snapId||S.editSnap), e=entryFor(s,el.dataset.p);
    if(!e.synced){ copyApply('fork',s.id,[e.path],'overwrite',true); }
    S.editSnap=s.id; S.path=e.path; S.screen='editor'; S.tab='Versions'; },
  promoteOne(el){ const sid=el.dataset.sid||S.snapId; S.modal={type:'copyMode',dir:'promote',snap:sid,paths:[el.dataset.p]}; },
  updateFrom(el){ const s=snap(S.snapId), e=entryFor(s,el.dataset.p);
    if(entryEdited(s,e)) S.modal={type:'copyMode',dir:'fork',snap:s.id,paths:[e.path]}; else A.doUpdate({dataset:{id:s.id,p:el.dataset.p}}); },
  enableLaunchAsk(el){ if(el&&el.dataset&&el.dataset.sid) S.snapId=el.dataset.sid; S.modal={type:'enableLaunch'}; },
  enableLaunch(){ snap(S.snapId).launch=true; S.modal=null; toast('Launch is on for '+snap(S.snapId).title); },
  launchOverwriteAll(){ const s=snap(S.snapId), paths=s.pages.filter(e=>entryChanged(s,e)).map(e=>e.path);
    if(s.pages.some(e=>entryChanged(s,e)&&entryEdited(s,e))) S.modal={type:'copyMode',dir:'fork',snap:s.id,paths}; else copyApply('fork',s.id,paths,'overwrite'); },
  launchPromoteAll(){ const s=snap(S.snapId); S.modal={type:'copyMode',dir:'promote',snap:s.id,paths:s.pages.filter(e=>canPromote(s,e)).map(e=>e.path)}; },
  copyDo(el){ const m=S.modal; S.modal=null; copyApply(m.dir,m.snap,m.paths,el.dataset.mode); },
  savePw(){ snap(S.snapId).password=document.getElementById('shpw').value.trim(); S.modal=null; toast(snap(S.snapId).password?'Password saved':'Password removed'); },
  copyLinks(){ S.modal=null; toast('Review links copied (mock)'); },
  fragments(){ S.modal={type:'fragments'}; },
  addFragments(){ const s=snap(S.snapId); const vals=[...document.querySelectorAll('#fglist input:checked')].map(i=>i.value); if(!vals.length){ toast('Pick at least one fragment'); return; }
    s.copies=s.copies||{}; s.base=s.base||{}; vals.forEach(f=>{ if(!entryFor(s,f)){ s.pages.push({path:f,review:'Not reviewed',isFragment:true}); s.copies[f]=clone(content(f)); s.base[f]=clone(content(f)); } });
    S.modal=null; toast(`Added ${vals.length} fragment${vals.length>1?'s':''} to ${s.title}`); },
  edMore(){ S.menu='edmore'; },
  toggleEarly(el){ const s=snap(S.snapId); if(!editable(s)||!isAuthor()) return; s.earlyAllowed=s.earlyAllowed||[]; const i=s.earlyAllowed.indexOf(el.dataset.u); if(i>=0) s.earlyAllowed.splice(i,1); else s.earlyAllowed.push(el.dataset.u); },
  publishEarlyAsk(){ S.sendOpen=false; S.modal={type:'publishEarly',path:S.path}; },
  publishEarly(){ const p=S.modal.path, r=document.getElementById('pereason').value.trim(); if(r.length<5){ toast('A reason is required (at least 5 characters)'); return; } if(!canPublishEarly(p)){ toast('You are not allowed to publish this page early'); S.modal=null; return; }
    const bl=blockers(p); const when=tick(); db.live[p]=when; db.liveContent[p]=clone(content(p)); db.ver[p]=(db.ver[p]||0)+1; db.liveVia[p]=null;
    db.early.push({path:p,by:uname(meId()),reason:r,when,blockedBy:bl.map(b=>b.id),version:db.ver[p]}); addComment(bl[0].id,p,'early-publish',r); S.modal=null; toast(title(p)+' published early · recorded with your reason'+notifyM(r)); },
  exportRecord(){ toast('Publish record downloaded (mock)'); },
  editDetails(){ S.modal={type:'editDetails'}; },
  saveDetails(){ const t=document.getElementById('edt').value.trim(); if(!t){ toast('A title is required'); return; } const sn=snap(S.snapId); sn.title=t; sn.description=document.getElementById('edd').value.trim(); S.modal=null; toast('Details saved'); },
  sendReqSnap(el){ S.snapId=el.dataset.id; S.sendOpen=false; S.modal={type:'request'}; },
  pageSchedOpen(){ S.modal={type:'pageSchedule',path:S.path}; },
  savePageSched(){ const v=document.getElementById('psw').value, d=new Date(v+':00-08:00'); if(!v||d<=NOW()){ toast('Pick a time in the future'); return; } db.pageSchedule[S.modal.path]=d.toISOString(); S.modal=null; toast('Scheduled · '+title(S.path)+' publishes '+fmt(d.toISOString())); },
  clearPageSched(){ delete db.pageSchedule[S.path]; S.modal=null; toast('Schedule canceled'); },
  inbox(){ S.inbox=!S.inbox; },
  inboxReadAll(){ inboxItems().forEach(i=>S.inboxRead.add(i.key)); },
  inboxOpen(el){ const it=inboxItems().find(x=>x.key===el.dataset.k); S.inbox=false; if(!it) return; S.inboxRead.add(it.key); S.editSnap=null;
    if(it.kind==='task'){ S.snapId=it.snap; S.screen='review'; S.reasonOpen=false; S.revPath=null; }
    else if(it.kind==='mention'){ const c=it.c, sx=snap(c.snap); if(c.page&&!isFolder(c.page)){ S.path=c.page; S.screen='editor'; S.tab='Comments'; } else if(sx){ S.snapId=sx.id; S.screen='snapshot'; } else toast('That request is in Earlier requests on its page'); }
    else { const sx=snap(it.snap); if(sx&&sx.single){ S.path=sx.pages[0].path; S.screen='editor'; S.tab='Review'; } else { S.snapId=it.snap; S.screen='snapshot'; } } },
  cmDone(el){ const c=db.comments[+el.dataset.i], me=meId(); const mine=c.author!==me&&mentionsIn(c.text).some(n=>myNames().includes(n)); c.done={by:uname(me),kind:mine?'done':'resolved'}; toast(mine?'Marked as done':'Resolved'); },
  cmReopen(el){ delete db.comments[+el.dataset.i].done; toast('Reopened'); },
  toggleResolved(){ S.resolvedOpen=!S.resolvedOpen; },
  toggleEarlier(){ S.earlierOpen=!S.earlierOpen; },
  tabReview(){ S.tab='Review'; S.panels=false; },
  railCompare(el){ const sn=snap(el.dataset.sid), p=S.path; S.modal={type:'cmp',title:'Review · '+title(p),ll:'Live',l:db.liveContent[p]||null,rl:'Snapshot version',r:copyFor(sn,p)}; },

  railApprove(el){ S.snapId=el.dataset.sid; S.revPath=el.dataset.p; A.approve(); },
  railReasonOpen(el){ S.railReason={sid:el.dataset.sid,p:el.dataset.p}; },
  railReasonCancel(){ S.railReason=null; },
  railRejectSend(el){ const t=document.getElementById('rreason').value.trim(); if(!t){ toast('A reason is required'); return; }
    const sn=snap(el.dataset.sid), e=sn.pages.find(x=>x.path===el.dataset.p); e.review='Needs changes'; autoDone(sn.id,e.path); addComment(sn.id,e.path,'reject-reason',t); S.railReason=null; toast('Changes requested · the author is notified'+notifyM(t)); },
  close(){ S.modal=null; },
  ovClose(el,e){ if(e.target===el) S.modal=null; }
};
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]'); const had=S.menu||S.panels||S.sendOpen||S.inbox;
  if(!a){ if(had){ if(!e.target.closest('.pop')&&!e.target.closest('.inbox')){ S.menu=null; S.panels=false; S.sendOpen=false; S.inbox=false; render(); } } return; }
  if(a.dataset.act==='ovClose'&&e.target!==a) return;
  const keep=a.dataset.act==='send'||a.closest('.pop');
  S.menu=null; S.panels=false; if(!keep) S.sendOpen=false; if(a.dataset.act!=='inbox'&&a.dataset.act!=='inboxReadAll') S.inbox=false;
